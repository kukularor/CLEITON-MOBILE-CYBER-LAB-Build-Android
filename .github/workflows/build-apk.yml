name: Compilar CLEITON MOBILE CYBER LAB APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Validar arquivos do projeto
        run: |
          test -f build_apk.py || { echo "::error::Envie o conteúdo da pasta CLEITON_CYBER_GUARDIAN do ZIP para a raiz deste repositório"; exit 1; }
          test -d app/src/main || { echo "::error::Pasta app/src/main ausente"; exit 1; }
      - name: Instalar ferramentas Android
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar e assinar APK de teste
        run: python3 build_apk.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: CLEITON_MOBILE_CYBER_LAB_debug_APK
          path: CLEITON_CYBER_GUARDIAN.apk
          if-no-files-found: error
